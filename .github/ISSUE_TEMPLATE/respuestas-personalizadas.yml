name: Pedido de respuestas personalizadas
description: Solicitar respuestas personalizadas para un rubro o producto.
title: "[RESPUESTAS PERSONALIZADAS] "
labels:
  - respuestas-personalizadas
body:
  - type: markdown
    attributes:
      value: |
        Gracias por pedir respuestas personalizadas.

        Antes de publicar este pedido:
        - Si necesitas ver todos los pasos, abre: https://bozicovichsantiago20-oss.github.io/kit-vendedor-express/respuestas-personalizadas.html
        - Paga USD 29 por PayPal: https://paypal.me/SBozicovich/29USD
        - O paga equivalente local por transferencia: Banco Galicia, CBU 0070034430004032923161
        - No compartas datos privados, claves, telefonos personales ni informacion sensible.
        - Usa solo links publicos, rubros, productos o ejemplos sin datos personales.

        La devolucion se entrega como comentario en este issue con respuestas para:
        precio, stock, envios, garantia, medidas, objeciones, seguimiento, cierre y postventa.
  - type: input
    id: payment_reference
    attributes:
      label: Referencia de pago
      description: Pega el link o codigo de PayPal, o una referencia no sensible de transferencia.
      placeholder: "PayPal / transferencia / fecha / importe"
    validations:
      required: true
  - type: input
    id: business_type
    attributes:
      label: Rubro o tipo de negocio
      placeholder: "Ej: zapatillas urbanas, repuestos, cosmetica, muebles, tecnologia"
    validations:
      required: true
  - type: textarea
    id: products
    attributes:
      label: Productos principales
      description: Lista 3 a 10 productos o categorias. No incluyas datos privados.
      placeholder: "Producto 1, producto 2, producto 3..."
    validations:
      required: true
  - type: dropdown
    id: main_channel
    attributes:
      label: Canal principal
      options:
        - Mercado Libre
        - WhatsApp
        - Instagram
        - Tienda propia
        - Otro marketplace
    validations:
      required: true
  - type: checkboxes
    id: needed_messages
    attributes:
      label: Que mensajes necesitas
      options:
        - label: Precio y descuentos
        - label: Stock y variantes
        - label: Envio y demora
        - label: Medidas o compatibilidad
        - label: Garantia o factura
        - label: Seguimiento y cierre
        - label: Reclamos, cambios o devoluciones
  - type: textarea
    id: tone
    attributes:
      label: Tono y contexto
      description: Cuenta si quieres tono formal, cercano o firme, y que dudas se repiten. No incluyas datos privados.
      placeholder: "Quiero tono claro y cercano. Me preguntan mucho por precio, envio y medidas..."
    validations:
      required: false
